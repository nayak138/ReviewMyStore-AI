              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteNfcDevice
      tags: [nfc]
      summary: Delete an NFC device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
