openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and session bootstrap
  - name: admin
    description: Super admin platform operations
  - name: businesses
    description: Business CRUD, lifecycle, and status management
  - name: dashboard
    description: Business dashboard summary data
  - name: campaigns
    description: Campaign CRUD, lifecycle, and keyword management
  - name: places
    description: Server-side proxy for Google Places search (pre-registration business lookup)
  - name: public-review
    description: Unauthenticated endpoints backing the public customer review page
  - name: qr
    description: Campaign QR code metadata and printable asset downloads
  - name: redirect
    description: Public dynamic redirect resolution for QR codes
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: review-management
    description: Authenticated Google Business review inbox and reply operations.
  - name: feedback
    description: Authenticated management of customer private feedback submissions
  - name: social-media
    description: Business-scoped social account connections, publishing, and comments
paths:
  /v1/review-management:
    get:
      operationId: getReviewDashboard
      tags: [review-management]
      summary: Get the caller's provider connection, locations, and review inbox summary
      parameters:
        - name: businessId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Review-management dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDashboardResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: No organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/review-management/connection:
    post:
      operationId: startReviewProviderConnection
      tags: [review-management]
      summary: Start the BNDLE-hosted Google Business authorization flow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewProviderConnectionInput"
      responses:
        "200":
          description: Provider authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewProviderConnectionStartResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Provider connection needs attention
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: disconnectReviewProvider
      tags: [review-management]
      summary: Disconnect the caller's Google Business review connection
      parameters:
        - name: businessId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated review-management dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDashboardResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: No organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/review-management/connection/locations:
    get:
      operationId: getReviewProviderLocations
      tags: [review-management]
      summary: >-
        Check the in-progress Google OAuth attempt and list selectable
        business locations once bundle.social confirms access
      parameters:
        - name: businessId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current stage of the custom connect flow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewProviderLocationsResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No connection attempt in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/review-management/connection/location:
    post:
      operationId: selectReviewProviderLocation
      tags: [review-management]
      summary: >-
        Pick the Google Business location for the in-progress connection and
        finish connecting (imports locations and reviews)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectReviewProviderLocationRequest"
      responses:
        "200":
          description: Refreshed dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDashboardResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No connection attempt in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/review-management/sync:
    post:
      operationId: syncReviewProvider
      tags: [review-management]
      summary: Synchronize Google Business locations and reviews from BNDLE
      parameters:
        - name: businessId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Refreshed dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDashboardResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Google Business is not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/review-management/reviews:
    get:
      operationId: listManagedReviews
      tags: [review-management]
      summary: List synchronized Google reviews with inbox filters
      parameters:
        - name: businessId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: locationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: rating
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: responseStatus
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ReviewResponseStatus"
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: Filtered review inbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedReviewListResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/review-management/reviews/{id}/draft:
    post:
      operationId: generateManagedReviewDraft
      tags: [review-management]
      summary: Generate an AI reply draft that requires human approval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated review with AI draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedReviewMutationResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Review not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/review-management/reviews/{id}/reply:
    post:
      operationId: publishManagedReviewReply
      tags: [review-management]
      summary: Publish an explicitly approved reply to Google Business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedReviewReplyInput"
      responses:
        "200":
          description: Updated review with published reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedReviewMutationResult"
        "400":
          description: Invalid reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Review not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteManagedReviewReply
      tags: [review-management]
      summary: Remove a published owner reply from Google Business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated review with reply removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedReviewMutationResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Review not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/social-media/dashboard:
    get:
      operationId: getSocialMediaDashboard
      tags: [social-media]
      summary: Get a business's connected social accounts and available accounts
      parameters:
        - name: businessId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Social media dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialMediaDashboardResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Business not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/social-media/connection:
    post:
      operationId: startSocialMediaConnection
      tags: [social-media]
      summary: Start connecting a Facebook, Instagram, or Threads account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialMediaConnectionInput"
      responses:
        "200":
          description: Provider authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialMediaConnectionStartResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Business not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: disconnectSocialMediaConnection
      tags: [social-media]
      summary: Clear a provider social account so a different login can be connected
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialMediaConnectionResetInput"
      responses:
        "204":
          description: Provider social account disconnected
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Business not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/social-media/accounts/attach:
    post:
      operationId: attachSocialMediaAccount
      tags: [social-media]
      summary: Attach a connected provider account to a business
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialMediaAccountAttachInput"
      responses:
        "200":
          description: Attached social account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialMediaAccount"
        "400":
          description: Invalid account or platform
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Business or provider account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/social-media/accounts/{id}:
    delete:
      operationId: detachSocialMediaAccount
      tags: [social-media]
      summary: Detach a social account from a business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Account detached
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/social-media/posts:
    get:
      operationId: listSocialMediaPosts
      tags: [social-media]
      summary: List recent social posts for a business
      parameters:
        - name: businessId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Social posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialMediaPostListResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createSocialMediaPost
      tags: [social-media]
      summary: Publish or schedule a social media post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialMediaPostInput"
      responses:
        "201":
          description: Created or scheduled post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialMediaPost"
        "400":
          description: Invalid post or no selected platform account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/social-media/media/upload-url:
    post:
      operationId: requestSocialMediaMediaUploadUrl
      tags: [social-media]
      summary: Request a constrained App Storage URL for social media
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialMediaMediaUploadInput"
      responses:
        "200":
          description: Presigned media upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Unsupported media or invalid business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/social-media/comments:
    get:
      operationId: listSocialMediaComments
      tags: [social-media]
      summary: List imported social media comments for a business
      parameters:
        - name: businessId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: postId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Imported comments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialMediaCommentListResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: importSocialMediaComments
      tags: [social-media]
      summary: Start importing comments for a social post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialMediaCommentImportInput"
      responses:
        "202":
          description: Comment import started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialMediaCommentImportResult"
        "400":
          description: Invalid post reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/social-media/comments/{id}/reply:
    post:
      operationId: replyToSocialMediaComment
      tags: [social-media]
      summary: Reply to an imported social media comment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialMediaCommentReplyInput"
      responses:
        "200":
          description: Published comment reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialMediaComment"
        "400":
          description: Invalid reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current authenticated user
      description: >
        Returns the authenticated user's profile and organization. On a
        user's first authenticated request, the backend automatically
        provisions their Organization + Owner record (or assigns the
        Super Admin role when the email is platform-preauthorized).
      responses:
        "200":
          description: Current user session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/email-preferences:
    get:
      operationId: getEmailPreferences
      tags: [auth]
      summary: Get the current account's email preferences
      description: >
        Returns the optional product email preferences for the authenticated
        account. Security and account-service messages are always enabled and
        are not configurable.
      responses:
        "200":
          description: Current account email preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailPreferences"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateEmailPreferences
      tags: [auth]
      summary: Update the current account's optional email preferences
      description: >
        Updates only optional product and release emails. Security and
        account-service messages remain enabled and cannot be disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailPreferencesUpdate"
      responses:
        "200":
          description: Updated account email preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailPreferences"
        "400":
          description: Invalid email preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/data-export:
    post:
      operationId: requestAccountDataExport
      tags: [auth]
      summary: Request an account-scoped data export
      description: >
        Returns a JSON export of the authenticated user's 5-Star.AI account
        record. Business, workspace, team, connection, campaign, and review
        data are intentionally excluded from this account-only export.
      responses:
        "200":
          description: Account data export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDataExportResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Export requests are temporarily rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/deactivation-request:
    post:
      operationId: requestAccountDeactivation
      tags: [auth]
      summary: Request account deactivation
      description: >
        Creates a pending account deactivation request after explicit
        confirmation. This endpoint does not delete the Clerk identity or
        alter business/workspace data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeactivationRequestBody"
      responses:
        "202":
          description: Deactivation request accepted for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeactivationRequestResponse"
        "400":
          description: Explicit confirmation is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Deactivation requests are temporarily rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Platform-wide counts (Super Admin only)
      description: >
        Lightweight platform snapshot used to verify Super Admin RBAC.
        Only accessible to users with role SUPER_ADMIN.
      responses:
        "200":
          description: Platform overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized (requires SUPER_ADMIN role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/admin/portal:
    get:
      operationId: getAdminPortal
      tags: [admin]
      summary: Platform agencies and businesses (Super Admin only)
      responses:
        "200":
          description: Platform administration data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPortal"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/admin/deactivation-requests:
    get:
      operationId: listAdminDeactivationRequests
      tags: [admin]
      summary: List account deactivation requests for review
      responses:
        "200":
          description: Deactivation review queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDeactivationRequestListResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/admin/deactivation-requests/{id}:
    patch:
      operationId: reviewAdminDeactivationRequest
      tags: [admin]
      summary: Approve or reject an account deactivation request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDeactivationRequestReviewInput"
      responses:
        "200":
          description: Reviewed deactivation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDeactivationRequest"
        "400":
          description: Invalid review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/admin/platform-data:
    delete:
      operationId: resetAdminPlatformData
      tags: [admin]
      summary: Delete all agency tenant data while preserving Super Admin accounts
      requestBody:
        required: true
