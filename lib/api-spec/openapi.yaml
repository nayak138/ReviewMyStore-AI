openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and session bootstrap
  - name: admin
    description: Super admin platform operations
  - name: businesses
    description: Business CRUD, lifecycle, and status management
  - name: dashboard
    description: Business dashboard summary data
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current authenticated user
      description: >
        Returns the authenticated user's profile and organization. On a
        user's first authenticated request, the backend automatically
        provisions their Organization + Owner record (or assigns the
        Super Admin role when the email is platform-preauthorized).
      responses:
        "200":
          description: Current user session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Platform-wide counts (Super Admin only)
      description: >
        Lightweight platform snapshot used to verify Super Admin RBAC.
        Only accessible to users with role SUPER_ADMIN.
      responses:
        "200":
          description: Platform overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized (requires SUPER_ADMIN role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/businesses:
    get:
      operationId: listBusinesses
      tags: [businesses]
      summary: List businesses for the caller's organization
      description: >
        Returns non-deleted businesses belonging to the caller's Organization.
        Archived businesses are included with archivedAt set; use the
        includeArchived=false query param to exclude them.
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: List of businesses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessListResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createBusiness
      tags: [businesses]
      summary: Create a business under the caller's organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessCreateInput"
      responses:
        "201":
          description: Business created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/businesses/{id}:
    get:
      operationId: getBusiness
      tags: [businesses]
      summary: Get a single business by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateBusiness
      tags: [businesses]
      summary: Edit a business
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessUpdateInput"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteBusiness
      tags: [businesses]
      summary: Soft-delete a business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Business soft-deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/businesses/{id}/archive:
    post:
      operationId: archiveBusiness
      tags: [businesses]
      summary: Archive a business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Archived business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/businesses/{id}/restore:
    post:
      operationId: restoreBusiness
      tags: [businesses]
      summary: Restore an archived business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Restored business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/businesses/{id}/status:
    patch:
      operationId: setBusinessStatus
      tags: [businesses]
      summary: Enable, suspend, or disable a business
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessStatusInput"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Business with updated status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard card counts and recent activity for the caller's organization
      description: >
        activeCampaigns, qrScans, and aiReviewsGenerated are placeholders
        (always 0) until their respective sprints are built.
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
      required:
        - success
        - code
        - message

    UserRole:
      type: string
      enum: [SUPER_ADMIN, OWNER]

    OrganizationStatus:
      type: string
      enum: [ACTIVE, SUSPENDED]

    OrganizationPlan:
      type: string
      enum: [STARTER, GROWTH, PRO, ENTERPRISE]

    SubscriptionStatus:
      type: string
      enum: [TRIALING, ACTIVE, PAST_DUE, CANCELED]

    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          $ref: "#/components/schemas/OrganizationStatus"
        plan:
          $ref: "#/components/schemas/OrganizationPlan"
        subscriptionStatus:
          $ref: "#/components/schemas/SubscriptionStatus"
        aiQuota:
          type: integer
        businessesLimit:
          type: integer
        startDate:
          type: ["string", "null"]
          format: date-time
        renewalDate:
          type: ["string", "null"]
          format: date-time
        expiryDate:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - status
        - plan
        - subscriptionStatus
        - aiQuota
        - businessesLimit
        - startDate
        - renewalDate
        - expiryDate
        - createdAt
        - updatedAt

    UserStatus:
      type: string
      enum: [ACTIVE, SUSPENDED]

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: ["string", "null"]
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        status:
          $ref: "#/components/schemas/UserStatus"
        lastLoginAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - organizationId
        - name
        - email
        - role
        - status
        - lastLoginAt
        - createdAt

    SessionInfo:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        organization:
          oneOf:
            - $ref: "#/components/schemas/Organization"
            - type: "null"
      required:
        - user
        - organization

    AdminOverview:
      type: object
      properties:
        totalOrganizations:
          type: integer
        totalOwners:
          type: integer
        totalSuperAdmins:
          type: integer
        totalSuspendedOrganizations:
          type: integer
      required:
        - totalOrganizations
        - totalOwners
        - totalSuperAdmins
        - totalSuspendedOrganizations

    BusinessStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, DISABLED]

    Business:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        name:
          type: string
        category:
          type: string
        googlePlaceId:
          type: ["string", "null"]
        slug:
          type: string
        logoUrl:
          type: ["string", "null"]
        coverImageUrl:
          type: ["string", "null"]
        brandColor:
          type: ["string", "null"]
        welcomeMessage:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/BusinessStatus"
        archivedAt:
          type: ["string", "null"]
          format: date-time
        deletedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - organizationId
        - name
        - category
        - googlePlaceId
        - slug
        - logoUrl
        - coverImageUrl
        - brandColor
        - welcomeMessage
        - status
        - archivedAt
        - deletedAt
        - createdAt
        - updatedAt

    BusinessListResult:
      type: object
      properties:
        businesses:
          type: array
          items:
            $ref: "#/components/schemas/Business"
      required:
        - businesses

    BusinessCreateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        googlePlaceId:
          type: ["string", "null"]
        slug:
          type: string
          minLength: 1
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        logoUrl:
          type: ["string", "null"]
        coverImageUrl:
          type: ["string", "null"]
        brandColor:
          type: ["string", "null"]
        welcomeMessage:
          type: ["string", "null"]
      required:
        - name
        - category
        - slug

    BusinessUpdateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        googlePlaceId:
          type: ["string", "null"]
        slug:
          type: string
          minLength: 1
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        logoUrl:
          type: ["string", "null"]
        coverImageUrl:
          type: ["string", "null"]
        brandColor:
          type: ["string", "null"]
        welcomeMessage:
          type: ["string", "null"]

    BusinessStatusInput:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/BusinessStatus"
      required:
        - status

    RecentActivityItem:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - message
        - createdAt

    DashboardSummary:
      type: object
      properties:
        totalBusinesses:
          type: integer
        activeBusinesses:
          type: integer
        activeCampaigns:
          type: integer
        qrScans:
          type: integer
        aiReviewsGenerated:
          type: integer
        needsOnboarding:
          type: boolean
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/RecentActivityItem"
      required:
        - totalBusinesses
        - activeBusinesses
        - activeCampaigns
        - qrScans
        - aiReviewsGenerated
        - needsOnboarding
        - recentActivity

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
