      description: >
        Public (unauthenticated). Returns 404 if the business or campaign
        doesn't exist, isn't ACTIVE, or is archived/deleted, so unpublished
        campaigns are never reachable by guessing a URL.
      parameters:
        - name: businessSlug
          in: path
          required: true
          schema:
            type: string
        - name: campaignSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public review page data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicReviewPageResult"
        "404":
          description: Not found or not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/public/review/{businessSlug}/{campaignSlug}/generate:
    post:
      operationId: generatePublicReview
      tags: [public-review]
      summary: Generate (or regenerate) an AI review draft for a customer session
      description: >
        Public (unauthenticated). Capped at 3 generations per sessionId to
        bound AI spend per customer visit; the 4th call returns 429.
      parameters:
        - name: businessSlug
          in: path
          required: true
          schema:
            type: string
        - name: campaignSlug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicGenerateReviewInput"
      responses:
        "200":
          description: Generated review text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicGenerateReviewResult"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found or not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Regeneration limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: AI provider error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/public/demo-review/generate:
    post:
      operationId: generateDemoReview
      tags: [public-review]
      summary: Generate an AI review draft for the interactive landing-page demo
      description: >
        Public (unauthenticated). Uses the same review-writing AI as a live
        campaign, but does not consume organization quota or create business
        analytics. Requests are rate limited by IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicGenerateReviewInput"
      responses:
        "200":
          description: Generated demo review text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicGenerateReviewResult"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: AI provider error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/public/review/{businessSlug}/{campaignSlug}/feedback:
    post:
      operationId: submitPrivateFeedback
      tags: [public-review]
      summary: Submit a private message to the business instead of/before posting publicly
      description: >
        Public (unauthenticated). Shown to the customer only when they select
        a low star rating; never posted to Google, never shown publicly —
        readable only by the business's own organization in the dashboard.
      parameters:
        - name: businessSlug
          in: path
          required: true
          schema:
            type: string
        - name: campaignSlug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivateFeedbackInput"
      responses:
        "201":
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateFeedbackResult"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found or not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/feedback:
    get:
      operationId: listPrivateFeedback
      tags: [feedback]
      summary: List private feedback submitted across the organization's businesses
      security:
        - clerkAuth: []
      parameters:
        - name: businessId
          in: query
          schema:
            type: string
        - name: campaignId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PrivateFeedbackStatus"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Private feedback list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPrivateFeedbackResult"
        "403":
          description: Account is not associated with an organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/feedback/{id}:
    patch:
      operationId: updatePrivateFeedbackStatus
      tags: [feedback]
      summary: Mark a private feedback item as viewed or resolved
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePrivateFeedbackStatusInput"
      responses:
        "200":
          description: Updated feedback item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateFeedbackItem"
        "403":
          description: Account is not associated with an organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/public/demo-requests:
    post:
      operationId: createDemoRequest
      tags: [public-review]
      summary: Submit a demo booking / sales lead from the marketing site
      description: >
        Public (unauthenticated). Persists the lead so the platform owner can
        review it from the admin API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoRequestInput"
      responses:
        "201":
          description: Lead stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoRequestResult"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/admin/demo-requests:
    get:
      operationId: listDemoRequests
      tags: [admin]
      summary: List demo booking requests (newest first)
      responses:
        "200":
          description: Demo requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDemoRequestsResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a super admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/admin/demo-requests/{id}/status:
    patch:
      operationId: setDemoRequestStatus
      tags: [admin]
      summary: Update a demo request's lead status and/or notes (Super Admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoRequestStatusUpdate"
      responses:
        "200":
          description: Updated demo request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoRequest"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a super admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/campaigns/{id}/qr:
    get:
      operationId: getCampaignQr
      tags: [qr]
      summary: Get (lazily creating) the campaign's QR redirect code and URLs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: QR code info for the campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignQrInfo"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/campaigns/{id}/qr/download/{format}:
    get:
      operationId: downloadCampaignQr
      tags: [qr]
      summary: Download the campaign QR code as a printable asset
      description: >
        Returns the QR code as a binary download. PNG is high resolution
        (1200px), SVG is vector, and PDF is a print-ready 4in x 6in page
        suitable for standees.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: format
          in: path
          required: true
          schema:
            type: string
            enum: [png, svg, pdf]
      responses:
        "200":
          description: Binary QR asset
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/public/redirect/{code}/resolve:
    post:
      operationId: resolveRedirect
      tags: [redirect]
      summary: Resolve a QR short code to its review page URL, logging a scan event
      description: >
        Unauthenticated. Called by the /r/{code} frontend route. Logs a
        QR_SCAN event (device/browser/OS parsed from the User-Agent, geo from
        proxy headers when available) and returns the
        relative review page path to redirect to.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedirectResolveRequest"
      responses:
        "200":
          description: Redirect target resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedirectResolveResult"
        "404":
          description: Unknown, inactive, or disabled code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/public/review/{businessSlug}/{campaignSlug}/track-redirect:
    post:
      operationId: trackGoogleRedirect
      tags: [public-review]
      summary: Log that a customer clicked through to post their review on Google
      parameters:
        - name: businessSlug
          in: path
          required: true
          schema:
            type: string
        - name: campaignSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Event logged
        "404":
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/public/review/{businessSlug}/{campaignSlug}/track-action:
    post:
      operationId: trackCustomerAction
      tags: [public-review]
      summary: Log a customer call or contact save from a public review page
      parameters:
        - name: businessSlug
          in: path
          required: true
          schema:
            type: string
        - name: campaignSlug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerActionInput"
      responses:
        "204":
          description: Event logged
        "400":
          description: Invalid action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/uploads/finalize:
    post:
      tags: [Storage]
      operationId: finalizeUpload
      summary: Finalize an authenticated object upload and assign its ACL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeUploadRequest"
      responses:
        "200":
          description: Upload finalized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadFinalizeResult"
        "400":
          description: Missing or invalid upload details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Upload is not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Uploaded object was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/public-assets/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicAsset
      summary: Serve an object with an explicit public ACL
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
      required:
        - success
        - code
        - message

    DemoRequestInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        leadType:
          type: string
          enum: [AGENCY, SINGLE_SHOP]
          description: Whether the prospect represents an agency or a single shop.
        email:
          type: string
          format: email
          maxLength: 320
        company:
          type: string
          maxLength: 200
        phone:
          type: string
          maxLength: 50
        locations:
          type: string
          maxLength: 50
        message:
          type: string
          maxLength: 2000
        website:
          type: string
          maxLength: 200
          description: >
            Honeypot anti-spam field. Hidden from real users; must be left
            empty. Submissions with a value are silently discarded.
      required:
        - name
        - leadType

    DemoRequestStatus:
      type: string
      enum: [NEW, CONTACTED, CLOSED]

    DemoRequest:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        leadType:
          type: [string, "null"]
          enum: [AGENCY, SINGLE_SHOP, null]
        email:
          type: ["string", "null"]
        company:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        locations:
          type: ["string", "null"]
        message:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/DemoRequestStatus"
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - leadType
        - company
        - phone
        - locations
        - message
        - status
        - notes
        - createdAt

    DemoRequestStatusUpdate:
      type: object
      description: >
        Partial update for a demo request. Provide status and/or notes;
        at least one field should be sent. notes replaces the stored value
        (send an empty string to clear).
      properties:
        status:
          $ref: "#/components/schemas/DemoRequestStatus"
        notes:
          type: string
          maxLength: 5000

    DemoRequestResult:
      type: object
      properties:
        id:
          type: string
      required:
        - id

    ListDemoRequestsResult:
      type: object
      properties:
        demoRequests:
          type: array
          items:
            $ref: "#/components/schemas/DemoRequest"
      required:
        - demoRequests

    UserRole:
      type: string
      enum: [SUPER_ADMIN, OWNER]

    OrganizationStatus:
      type: string
      enum: [ACTIVE, SUSPENDED]

    OrganizationPlan:
      type: string
      enum: [STARTER, GROWTH, PRO, ENTERPRISE]

    SubscriptionStatus:
      type: string
      enum: [TRIALING, ACTIVE, PAST_DUE, CANCELED]

    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          $ref: "#/components/schemas/OrganizationStatus"
        plan:
          $ref: "#/components/schemas/OrganizationPlan"
        subscriptionStatus:
          $ref: "#/components/schemas/SubscriptionStatus"
        aiQuota:
          type: integer
        businessesLimit:
          type: integer
        startDate:
          type: ["string", "null"]
          format: date-time
        renewalDate:
          type: ["string", "null"]
          format: date-time
        expiryDate:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - status
        - plan
        - subscriptionStatus
        - aiQuota
        - businessesLimit
        - startDate
        - renewalDate
        - expiryDate
        - createdAt
        - updatedAt

    UserStatus:
      type: string
      enum: [ACTIVE, SUSPENDED]

    EmailPreferences:
      type: object
      properties:
        productUpdates:
          type: boolean
          description: Whether optional product update emails are enabled
        releaseAnnouncements:
          type: boolean
          description: Whether optional release announcement emails are enabled
        securityMessages:
          type: boolean
          description: Required security messages are always enabled
        accountServiceMessages:
          type: boolean
          description: Required account-service messages are always enabled
      required:
        - productUpdates
        - releaseAnnouncements
        - securityMessages
        - accountServiceMessages

    EmailPreferencesUpdate:
      type: object
      properties:
        productUpdates:
          type: boolean
        releaseAnnouncements:
          type: boolean
      minProperties: 1

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: ["string", "null"]
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        status:
          $ref: "#/components/schemas/UserStatus"
        lastLoginAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - organizationId
        - name
        - email
        - role
        - status
        - lastLoginAt
        - createdAt

    AccountExportProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        status:
          $ref: "#/components/schemas/UserStatus"
        lastLoginAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - role
        - status
        - lastLoginAt
        - createdAt

    AccountDataExportResponse:
      type: object
      properties:
        exportId:
          type: string
          format: uuid
        requestedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        scope:
          type: string
          enum: [ACCOUNT]
        account:
          $ref: "#/components/schemas/AccountExportProfile"
        excludedData:
          type: array
          items:
            type: string
      required:
        - exportId
        - requestedAt
        - expiresAt
        - scope
        - account
        - excludedData

    AccountDeactivationRequestBody:
      type: object
      properties:
        confirmation:
          type: string
          enum: [DEACTIVATE]
      required:
        - confirmation

    AccountDeactivationRequestResponse:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        requestedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [PENDING_REVIEW]
        message:
          type: string
      required:
        - requestId
        - requestedAt
        - status
        - message

    AdminDeactivationRequestStatus:
      type: string
      enum: [PENDING_REVIEW, APPROVED, REJECTED]

    AdminDeactivationRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        userName:
          type: string
        userEmail:
          type: string
          format: email
        organizationId:
          type: ["string", "null"]
          format: uuid
        organizationName:
          type: ["string", "null"]
        requestedAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/AdminDeactivationRequestStatus"
        reviewedAt:
          type: ["string", "null"]
          format: date-time
        reviewedByUserId:
          type: ["string", "null"]
          format: uuid
        reviewerNote:
          type: ["string", "null"]
      required:
        - id
        - userId
        - userName
        - userEmail
        - organizationId
        - organizationName
        - requestedAt
        - status
        - reviewedAt
        - reviewedByUserId
        - reviewerNote

    AdminDeactivationRequestListResult:
      type: object
      properties:
        requests:
