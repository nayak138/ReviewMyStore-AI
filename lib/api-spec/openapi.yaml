openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and session bootstrap
  - name: admin
    description: Super admin platform operations
  - name: businesses
    description: Business CRUD, lifecycle, and status management
  - name: dashboard
    description: Business dashboard summary data
  - name: campaigns
    description: Campaign CRUD, lifecycle, and keyword management
  - name: places
    description: Server-side proxy for Google Places search (pre-registration business lookup)
  - name: public-review
    description: Unauthenticated endpoints backing the public customer review page
  - name: qr
    description: Campaign QR code metadata and printable asset downloads
  - name: nfc
    description: NFC device registration, assignment, and lifecycle management
  - name: redirect
    description: Public dynamic redirect resolution for QR codes and NFC devices
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: review-management
    description: Authenticated Google Business review inbox and reply operations.
paths:
  /v1/review-management:
    get:
      operationId: getReviewDashboard
      tags: [review-management]
      summary: Get the caller's provider connection, locations, and review inbox summary
      responses:
        "200":
          description: Review-management dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDashboardResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: No organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/review-management/connection:
    post:
      operationId: startReviewProviderConnection
      tags: [review-management]
      summary: Start the BNDLE-hosted Google Business authorization flow
      responses:
        "200":
          description: Provider authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewProviderConnectionStartResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Provider connection needs attention
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: disconnectReviewProvider
      tags: [review-management]
      summary: Disconnect the caller's Google Business review connection
      responses:
        "200":
          description: Updated review-management dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDashboardResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: No organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/review-management/connection/locations:
    get:
      operationId: getReviewProviderLocations
      tags: [review-management]
      summary: >-
        Check the in-progress Google OAuth attempt and list selectable
        business locations once bundle.social confirms access
      responses:
        "200":
          description: Current stage of the custom connect flow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewProviderLocationsResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No connection attempt in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/review-management/connection/location:
    post:
      operationId: selectReviewProviderLocation
      tags: [review-management]
      summary: >-
        Pick the Google Business location for the in-progress connection and
        finish connecting (imports locations and reviews)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectReviewProviderLocationRequest"
      responses:
        "200":
          description: Refreshed dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDashboardResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No connection attempt in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/review-management/sync:
    post:
      operationId: syncReviewProvider
      tags: [review-management]
      summary: Synchronize Google Business locations and reviews from BNDLE
      responses:
        "200":
          description: Refreshed dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDashboardResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Google Business is not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/review-management/reviews:
    get:
      operationId: listManagedReviews
      tags: [review-management]
      summary: List synchronized Google reviews with inbox filters
      parameters:
        - name: locationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: rating
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: responseStatus
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ReviewResponseStatus"
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: Filtered review inbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedReviewListResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/review-management/reviews/{id}/draft:
    post:
      operationId: generateManagedReviewDraft
      tags: [review-management]
      summary: Generate an AI reply draft that requires human approval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated review with AI draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedReviewMutationResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Review not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/review-management/reviews/{id}/reply:
    post:
      operationId: publishManagedReviewReply
      tags: [review-management]
      summary: Publish an explicitly approved reply to Google Business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedReviewReplyInput"
      responses:
        "200":
          description: Updated review with published reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedReviewMutationResult"
        "400":
          description: Invalid reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Review not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteManagedReviewReply
      tags: [review-management]
      summary: Remove a published owner reply from Google Business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated review with reply removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedReviewMutationResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Review not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current authenticated user
      description: >
        Returns the authenticated user's profile and organization. On a
        user's first authenticated request, the backend automatically
        provisions their Organization + Owner record (or assigns the
        Super Admin role when the email is platform-preauthorized).
      responses:
        "200":
          description: Current user session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Platform-wide counts (Super Admin only)
      description: >
        Lightweight platform snapshot used to verify Super Admin RBAC.
        Only accessible to users with role SUPER_ADMIN.
      responses:
        "200":
          description: Platform overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized (requires SUPER_ADMIN role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/businesses:
    get:
      operationId: listBusinesses
      tags: [businesses]
      summary: List businesses for the caller's organization
      description: >
        Returns non-deleted businesses belonging to the caller's Organization.
        Archived businesses are included with archivedAt set; use the
        includeArchived=false query param to exclude them.
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: List of businesses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessListResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createBusiness
      tags: [businesses]
      summary: Create a business under the caller's organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessCreateInput"
      responses:
        "201":
          description: Business created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/businesses/{id}:
    get:
      operationId: getBusiness
      tags: [businesses]
      summary: Get a single business by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateBusiness
      tags: [businesses]
      summary: Edit a business
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessUpdateInput"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteBusiness
      tags: [businesses]
      summary: Soft-delete a business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Business soft-deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/businesses/{id}/archive:
    post:
      operationId: archiveBusiness
      tags: [businesses]
      summary: Archive a business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Archived business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/businesses/{id}/restore:
    post:
      operationId: restoreBusiness
      tags: [businesses]
      summary: Restore an archived business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Restored business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/businesses/{id}/status:
    patch:
      operationId: setBusinessStatus
      tags: [businesses]
      summary: Enable, suspend, or disable a business
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessStatusInput"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Business with updated status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard card counts and recent activity for the caller's organization
      description: >
        activeCampaigns, qrScans, and aiReviewsGenerated are placeholders
        (always 0) until their respective sprints are built.
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List campaigns for a business
      parameters:
        - name: businessId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: List of campaigns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignListResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Business not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create a campaign under a business
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignCreateInput"
      responses:
        "201":
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Business not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/campaigns/{id}:
    get:
      operationId: getCampaign
      tags: [campaigns]
      summary: Get a single campaign by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Edit a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignUpdateInput"
      responses:
        "200":
          description: Campaign updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Soft-delete a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Campaign soft-deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/campaigns/{id}/archive:
    post:
      operationId: archiveCampaign
      tags: [campaigns]
      summary: Archive a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Campaign archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/campaigns/{id}/restore:
    post:
      operationId: restoreCampaign
      tags: [campaigns]
      summary: Restore an archived campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Campaign restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/campaigns/{id}/status:
    patch:
      operationId: setCampaignStatus
      tags: [campaigns]
      summary: Change a campaign's status (DRAFT/ACTIVE/DISABLED)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignStatusInput"
      responses:
        "200":
          description: Campaign status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/campaign-templates:
    get:
      operationId: listCampaignTemplates
      tags: [campaigns]
      summary: Built-in campaign templates with suggested keywords
      description: >
        Static, in-code list used to pre-fill a new campaign's name and
        keyword suggestions during onboarding. Not stored in the database.
      responses:
        "200":
          description: List of campaign templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignTemplateListResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/campaigns/{campaignId}/keywords:
    get:
      operationId: listKeywords
      tags: [campaigns]
      summary: List keywords for a campaign
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of keywords
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeywordListResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createKeyword
      tags: [campaigns]
      summary: Add a keyword to a campaign
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeywordCreateInput"
      responses:
        "201":
          description: Keyword created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Keyword"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
