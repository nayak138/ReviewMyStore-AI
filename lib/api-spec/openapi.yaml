    ReviewProviderConnectionStartResult:
      type: object
      description: >-
        `authUrl` is set when a fresh Google OAuth round trip is needed —
        open it in a new tab. It is null when bundle.social already has a
        Google Business account connected for this organization's team (e.g.
        a previous attempt got interrupted before a location was picked); in
        that case `stage`/`locations` describe what to do next, exactly like
        the connection-locations endpoint, and no new tab is needed.
      properties:
        connection:
          $ref: "#/components/schemas/ReviewProviderConnection"
        authUrl:
          type: ["string", "null"]
          format: uri
        stage:
          $ref: "#/components/schemas/ReviewProviderLocationStage"
        locations:
          type: array
          items:
            $ref: "#/components/schemas/ReviewProviderLocationOption"
      required: [connection, authUrl, stage, locations]

    ReviewProviderConnectionInput:
      type: object
      properties:
        businessId:
          type: string
          description: Business workspace to return to after Google authorization
      required: [businessId]

    ReviewProviderLocationStage:
      type: string
      description: >-
        NOT_CONNECTED: the Google OAuth step hasn't completed yet (or was
        cancelled/failed) — no business account is attached.
        NEEDS_LOCATION: Google access is granted; pick one of `locations` to
        finish connecting.
        NO_LOCATIONS_FOUND: Google access is granted but no eligible business
        locations were found on that account.
        READY: a location is already selected and syncing is starting.
      enum: [NOT_CONNECTED, NEEDS_LOCATION, NO_LOCATIONS_FOUND, READY]

    ReviewProviderLocationOption:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: ["string", "null"]
      required: [id, name, address]

    ReviewProviderLocationsResult:
      type: object
      properties:
        stage:
          $ref: "#/components/schemas/ReviewProviderLocationStage"
        locations:
          type: array
          items:
            $ref: "#/components/schemas/ReviewProviderLocationOption"
      required: [stage, locations]

