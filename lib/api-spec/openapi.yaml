          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/nfc-devices/{id}/assign:
    post:
      operationId: assignNfcDevice
      tags: [nfc]
      summary: Assign (or reassign) an NFC device to a campaign
      description: >
        Assigning derives the business from the campaign, sets status to
        ASSIGNED, stamps assignedAt, and ensures the device has an active
        redirect link. Reassigning points the existing redirect link at the
        new campaign — no re-writing of the physical tag is needed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NfcDeviceAssignInput"
      responses:
        "200":
          description: NFC device assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NfcDevice"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: NFC device or campaign not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/nfc-devices/{id}/unassign:
    post:
      operationId: unassignNfcDevice
      tags: [nfc]
      summary: Remove an NFC device's campaign assignment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: NFC device unassigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NfcDevice"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: NFC device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/nfc-devices/{id}/status:
    post:
      operationId: setNfcDeviceStatus
      tags: [nfc]
      summary: Activate or disable an NFC device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NfcDeviceStatusInput"
      responses:
        "200":
          description: NFC device status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NfcDevice"
        "400":
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: NFC device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/public/redirect/{code}/resolve:
    post:
      operationId: resolveRedirect
      tags: [redirect]
      summary: Resolve a QR/NFC short code to its review page URL, logging a scan event
      description: >
        Unauthenticated. Called by the /r/{code} frontend route. Logs a
        QR_SCAN or NFC_TAP event (device/browser/OS parsed from the
        User-Agent, geo from proxy headers when available) and returns the
        relative review page path to redirect to.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedirectResolveRequest"
      responses:
        "200":
          description: Redirect target resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedirectResolveResult"
        "404":
          description: Unknown, inactive, or disabled code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/public/review/{businessSlug}/{campaignSlug}/track-redirect:
    post:
      operationId: trackGoogleRedirect
      tags: [public-review]
      summary: Log that a customer clicked through to post their review on Google
      parameters:
        - name: businessSlug
          in: path
          required: true
          schema:
            type: string
        - name: campaignSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Event logged
        "404":
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
      required:
        - success
        - code
        - message

    DemoRequestInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 320
        company:
          type: string
          maxLength: 200
        phone:
          type: string
          maxLength: 50
        locations:
          type: string
          maxLength: 50
        message:
          type: string
          maxLength: 2000
        website:
          type: string
          maxLength: 200
          description: >
            Honeypot anti-spam field. Hidden from real users; must be left
            empty. Submissions with a value are silently discarded.
      required:
        - name
        - email

    DemoRequestStatus:
      type: string
      enum: [NEW, CONTACTED, CLOSED]

    DemoRequest:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        company:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        locations:
          type: ["string", "null"]
        message:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/DemoRequestStatus"
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - company
        - phone
        - locations
        - message
        - status
        - notes
        - createdAt

    DemoRequestStatusUpdate:
      type: object
      description: >
        Partial update for a demo request. Provide status and/or notes;
        at least one field should be sent. notes replaces the stored value
        (send an empty string to clear).
      properties:
        status:
          $ref: "#/components/schemas/DemoRequestStatus"
        notes:
          type: string
          maxLength: 5000

    DemoRequestResult:
      type: object
      properties:
        id:
          type: string
      required:
        - id

    ListDemoRequestsResult:
      type: object
      properties:
        demoRequests:
          type: array
          items:
            $ref: "#/components/schemas/DemoRequest"
      required:
        - demoRequests

    UserRole:
      type: string
      enum: [SUPER_ADMIN, OWNER]

    OrganizationStatus:
      type: string
      enum: [ACTIVE, SUSPENDED]

    OrganizationPlan:
      type: string
      enum: [STARTER, GROWTH, PRO, ENTERPRISE]

    SubscriptionStatus:
      type: string
      enum: [TRIALING, ACTIVE, PAST_DUE, CANCELED]

    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          $ref: "#/components/schemas/OrganizationStatus"
        plan:
          $ref: "#/components/schemas/OrganizationPlan"
        subscriptionStatus:
          $ref: "#/components/schemas/SubscriptionStatus"
        aiQuota:
          type: integer
        businessesLimit:
          type: integer
        startDate:
          type: ["string", "null"]
          format: date-time
        renewalDate:
          type: ["string", "null"]
          format: date-time
        expiryDate:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - status
        - plan
        - subscriptionStatus
        - aiQuota
        - businessesLimit
        - startDate
        - renewalDate
        - expiryDate
        - createdAt
        - updatedAt

    UserStatus:
      type: string
      enum: [ACTIVE, SUSPENDED]

    UserProfile:
      type: object
      properties:
        id:
          type: string
