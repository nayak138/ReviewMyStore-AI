  /v1/places/photo:
    get:
      operationId: getPlacePhoto
      tags: [places]
      summary: Proxy a Google Place photo so the API key stays server-side
      description: >
        Public (unauthenticated). `name` must be the raw photo resource name
        returned as `photoName` on PlaceDetails (e.g. "places/X/photos/Y").
