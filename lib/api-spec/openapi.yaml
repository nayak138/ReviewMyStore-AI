      summary: Fetch the data needed to render a public review page
      description: >
        Public (unauthenticated). Returns 404 if the business or campaign
        doesn't exist, isn't ACTIVE, or is archived/deleted, so unpublished
        campaigns are never reachable by guessing a URL.
      parameters:
        - name: businessSlug
          in: path
          required: true
          schema:
            type: string
        - name: campaignSlug
          in: path
          required: true
          schema:
