        "400":
          description: Missing input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Upstream Google Places error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/places/details/{placeId}:
    get:
      operationId: getPlaceDetails
      tags: [places]
      summary: Fetch full details for a selected Google Place
      description: >
        Public (unauthenticated) — used to pre-fill the registration form
        once the owner picks a suggestion.
      parameters:
