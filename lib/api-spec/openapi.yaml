      description: >
        Public (unauthenticated) — used on the pre-registration business
        search step. Proxies Google Places Autocomplete so the API key never
        reaches the browser.
      parameters:
        - name: input
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Autocomplete suggestions
          content:
            application/json:
