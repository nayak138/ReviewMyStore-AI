kind = "web"
previewPath = "/"
title = "ReviewMyStore.ai — Product Video"
description = "A looping 16:9 motion story showing ReviewMyStore.ai from business search to reputation growth."
version = "1.0.0"
id = "artifacts/reviewmystore-video"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25505

[services.development]
run = "pnpm --filter @workspace/reviewmystore-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/reviewmystore-video", "run", "build" ]
serve = "static"
publicDir = "artifacts/reviewmystore-video/dist"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25505"
BASE_PATH = "/"

[video]
videoAspectRatio = "16:9"